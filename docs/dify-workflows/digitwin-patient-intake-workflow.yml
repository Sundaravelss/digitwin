      # ══════════════════════════════════════════════════════════════════════
      # B7. LLM — Combined Analysis + Simulation (MERGED — was 2 nodes)
      #
      # This node replaces the old separate "Cross-Reference" and
      # "Simulate Biomarker Impact" nodes. Combining them into one LLM
      # call saves a full round-trip (~3-5s).
      # ══════════════════════════════════════════════════════════════════════
      - data:
          title: Simulating health impact on your DigiTwin...
          desc: >-
            Combined node: cross-references the item against the patient's
            clinical profile (drug interactions, allergies, pharmacogenomics,
            dietary restrictions) AND generates time-series biomarker
            projections — all in a single LLM call.
          type: llm
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.25
              max_tokens: 4000
          context:
            enabled: true
            variable_selector:
              - node_kb_sim
              - result
          vision:
            enabled: false
          prompt_template:
            - id: sys_analysis_sim
              role: system
              text: >-
                You are the clinical analysis and biomarker simulation engine
                for the DigiTwin biological digital twin platform. You will
                perform TWO tasks in a single pass:

                (A) Cross-reference the intake item against the patient's profile
                (B) Generate biomarker projections over time


                ═══ PATIENT PROFILE (from Knowledge Base) ═══

                {{#context#}}


                ═══ ITEM IDENTIFIED ═══

                Name: {{#node_code_router.item_name#}}

                Category: {{#node_code_router.category#}}

                Quantity/Dosage: {{#node_code_router.quantity#}} {{#node_code_router.dosage#}}


                ═══ API DATA (nutritional or pharmaceutical) ═══

                {{#node_merge_api.output#}}


                ═══ TASK A: CROSS-REFERENCE ═══

                Perform these safety checks:

                1. **Drug-drug interactions** with current medications

                2. **Allergen check** against patient's allergy list (including
                cross-reactivity, e.g. Penicillin → cephalosporin)

                3. **Pharmacogenomic interactions**:
                   - Check CYP2D6, CYP2C19, CYP3A4, SLCO1B1, VKORC1 metabolizer status
                   - Poor metabolizer → accumulation risk
                   - Rapid/ultrarapid → subtherapeutic levels

                4. **Disease risk amplification** (e.g. high-sugar food + prediabetes)

                5. **Dietary restriction violations** (lactose, caffeine sensitivity)

                6. **Trait marker flags** (lactose intolerance, caffeine slow metabolizer)

                Note: API data may come from a web search fallback if the primary
                API (USDA or OpenFDA) failed. Adapt your analysis accordingly.


                ═══ TASK B½: ACTIVITY SUGGESTIONS (food items only) ═══

                If the item is a food/snack/beverage, suggest physical activities
                the patient could do to burn off the estimated calories. Tailor
                suggestions to the patient's:
                - Current fitness level and lifestyle (from profile)
                - Medical conditions and physical limitations
                - Age and BMI

                For each activity, provide:
                - activity_name: e.g. "Brisk Walking", "Cycling", "Swimming"
                - duration_minutes: how long to burn those calories
                - calories_burned: should roughly match the food's calorie count
                - intensity: "light" | "moderate" | "vigorous"
                - note: any patient-specific consideration (e.g. "gentle on joints")

                Suggest 3-5 activities ranging from light to vigorous intensity.
                If the item is a medication or supplement, set activity_suggestions
                to null.


                ═══ TASK B: BIOMARKER SIMULATION ═══

                CRITICAL: You MUST first READ the patient profile above and
                EXTRACT their current biomarker values. Do NOT guess or use
                generic population averages. Use the EXACT numbers from the
                Knowledge Base data (e.g. fasting glucose, HbA1c, CRP, heart
                rate, HRV, blood pressure, health score, weight, BMI, etc.).

                Step B1 — Extract current readings from the patient profile:
                - fasting_glucose (from latestLabs or biomarkers section)
                - hba1c (from latestLabs)
                - crp (from latestLabs or biomarkers)
                - resting_heart_rate (from vitals or biomarkers)
                - hrv_ms (from vitals or biomarkers)
                - systolic, diastolic (from vitals or biomarkers)
                - overall_health_score (from biomarkers)
                - weight_kg, bmi (from demographics or vitals)
                - any other relevant biomarkers present in the profile

                If a value is missing from the profile, state "not available"
                in baseline_biomarkers and use a reasonable clinical estimate.

                Step B2 — Project changes from THOSE EXACT baselines:

                Simulation window: {{#node_start.simulation_window#}}

                Timepoints: [0h, 1h, 2h, 4h, 8h, 24h, 3d, 7d, 14d, 30d]
                (If "acute" → focus 0h–24h. If "extended" → 3d–30d. If "both" → all.)

                Project these biomarkers:
                - glucose_mg_dl, crp_mg_l, resting_heart_rate, hrv_ms
                - systolic, diastolic, overall_health_delta (-20 to +10)

                Rules:
                - projections[0h] MUST equal the patient's current baseline value
                - Factor in CYP metabolizer status for medication kinetics
                - Use labHistory/longitudinal data for realistic change rates
                - Account for current medications buffering/amplifying effects
                - Food: acute glucose spike + return to baseline
                - Medications: pharmacokinetic ramp-up curve


                ═══ OUTPUT FORMAT ═══

                Return ONLY valid JSON combining both tasks:

                {
                  "patient_id": "string",
                  "patient_name": "string",
                  "item_identified": "string",
                  "item_category": "string",
                  "nutritional_or_pharma_data": {
                    "calories": number or null,
                    "protein_g": number or null,
                    "carbs_g": number or null,
                    "fat_g": number or null,
                    "sodium_mg": number or null,
                    "sugar_g": number or null,
                    "fiber_g": number or null,
                    "glycemic_index": number or null,
                    "active_ingredients": ["string"] or null,
                    "mechanism": "string" or null,
                    "cyp_pathways": ["string"] or null
                  },
                  "patient_alerts": [
                    {
                      "type": "interaction | allergy | contraindication | pharmacogenomic | dietary_restriction | disease_risk",
                      "severity": "low | moderate | high | critical",
                      "message": "string",
                      "evidence": "string"
                    }
                  ],
                  "baseline_biomarkers": {
                    "fasting_glucose": "EXACT value from patient KB",
                    "hba1c": "EXACT value from patient KB",
                    "crp": "EXACT value from patient KB",
                    "resting_heart_rate": "EXACT value from patient KB",
                    "hrv_ms": "EXACT value from patient KB",
                    "systolic": "EXACT value from patient KB",
                    "diastolic": "EXACT value from patient KB",
                    "overall_health_score": "EXACT value from patient KB",
                    "weight_kg": "from patient KB if available",
                    "bmi": "from patient KB if available"
                  },
                  "simulation": {
                    "timepoints": ["0h", "1h", "2h", "4h", "8h", "24h", "3d", "7d", "14d", "30d"],
                    "projections": {
                      "glucose_mg_dl": [number, ...],
                      "crp_mg_l": [number, ...],
                      "resting_heart_rate": [number, ...],
                      "hrv_ms": [number, ...],
                      "systolic": [number, ...],
                      "diastolic": [number, ...],
                      "overall_health_delta": [number, ...]
                    },
                    "sleep_quality_impact": "improved | neutral | degraded",
                    "peak_glucose_time": "string",
                    "return_to_baseline": "string",
                    "health_score_impact": {
                      "metabolic": number,
                      "cardiovascular": number,
                      "overall": number
                    }
                  },
                  "activity_suggestions": [
                    {
                      "activity_name": "e.g. Brisk Walking",
                      "duration_minutes": "number",
                      "calories_burned": "number",
                      "intensity": "light | moderate | vigorous",
                      "note": "patient-specific consideration or null"
                    }
                  ] or null,
                  "text_summary": "3-5 sentence summary that MUST reference the patient's current values AND mention activity options to offset calories (e.g. 'Your glucose is currently 105 mg/dL; this meal would spike it to ~145 mg/dL within 1 hour. A 30-min brisk walk could help burn off the ~350 calories.')",
                  "concern": "string or null",
                  "pharmacogenomic_note": "string or null",
                  "suggestions": ["string", "string", "string"]
                }
            - id: usr_analysis_sim
              role: user
              text: >-
                Analyze and simulate the biomarker impact for patient
                {{#node_start.patient_id#}} after intake of
                {{#node_code_router.item_name#}}.
          variables: []
          memory:
            enabled: false
            window:
              enabled: false
              size: 10
        height: 350
        id: node_llm_analysis_sim
        position:
          x: 3980
          y: 380
        type: custom
        width: 244

      # ── B8. CODE — Validate & Assemble Final JSON ──────────────────────
      - data:
          title: Validating biomarker projections...
          desc: >-
            Validates the combined analysis+simulation JSON, clamps biomarker
            values to realistic ranges, and produces the final response.
          type: code
          code_language: python3
          code: |
            import json
            import re

            def extract_json(text: str) -> dict:
                """Extract JSON from LLM output, handling markdown code blocks."""
                try:
                    return json.loads(text)
                except Exception:
                    pass
                match = re.search(r'```(?:json)?\s*(\{[\s\S]*?\})\s*```', text)
                if match:
                    try:
                        return json.loads(match.group(1))
                    except Exception:
                        pass
                depth = 0
                start = -1
                for i, c in enumerate(text):
                    if c == '{':
                        if depth == 0:
                            start = i
                        depth += 1
                    elif c == '}':
                        depth -= 1
                        if depth == 0 and start >= 0:
                            try:
                                return json.loads(text[start:i+1])
                            except Exception:
                                pass
                return {}

            def clamp(val, lo, hi):
                if val is None:
                    return lo
                return max(lo, min(hi, val))

            def main(analysis_sim_text: str, patient_id: str) -> dict:
                data = extract_json(analysis_sim_text)

                # Validate simulation projections
                simulation = data.get("simulation", {})
                projections = simulation.get("projections", {})

                if "glucose_mg_dl" in projections:
                    projections["glucose_mg_dl"] = [
                        clamp(v, 50, 400) for v in projections["glucose_mg_dl"]
                    ]
                if "resting_heart_rate" in projections:
                    projections["resting_heart_rate"] = [
                        clamp(v, 40, 180) for v in projections["resting_heart_rate"]
                    ]
                if "systolic" in projections:
                    projections["systolic"] = [
                        clamp(v, 80, 220) for v in projections["systolic"]
                    ]
                if "diastolic" in projections:
                    projections["diastolic"] = [
                        clamp(v, 40, 140) for v in projections["diastolic"]
                    ]

                result = {
                    "patient_id": data.get("patient_id", patient_id),
                    "patient_name": data.get("patient_name", ""),
                    "item_identified": data.get("item_identified", ""),
                    "item_category": data.get("item_category", ""),
                    "nutritional_or_pharma_data": data.get("nutritional_or_pharma_data", {}),
                    "patient_alerts": data.get("patient_alerts", []),
                    "simulation": simulation,
                    "activity_suggestions": data.get("activity_suggestions"),
                    "text_summary": data.get("text_summary", ""),
                    "concern": data.get("concern"),
                    "pharmacogenomic_note": data.get("pharmacogenomic_note"),
                    "suggestions": data.get("suggestions", [])
                }

                return {"result": json.dumps(result, indent=2)}
          variables:
            - value_selector:
                - node_llm_analysis_sim
                - text
              variable: analysis_sim_text
            - value_selector:
                - node_start
                - patient_id
              variable: patient_id
          outputs:
            result:
              type: string
              children: null
        height: 180
        id: node_code_validate
        position:
          x: 4280
          y: 480
        type: custom
        width: 244

      # ── B9. ANSWER — Simulation Result ─────────────────────────────────
      - data:
          title: Return Simulation Result
          type: answer
          answer: "{{#node_code_validate.result#}}"
        height: 80
