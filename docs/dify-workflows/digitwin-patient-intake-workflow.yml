##############################################################################
# DigiTwin — Patient Health Companion Workflow v2 (Dify DSL)
#
# ARCHITECTURE (v3 — optimized):
#   A merged Classify+Route node (gpt-4o-mini) does intent classification AND
#   item identification in ONE LLM call. It also analyzes image content before
#   deciding — no blanket "image = simulation" assumption.
#
#   • general_chat  → fast path: KB + LLM Direct Answer (2 LLM calls)
#   • simulation    → KB retrieval + API calls run IN PARALLEL, then
#                     a single Analysis+Simulation LLM (2 LLM calls total)
#
#   General queries ("what's my blood pressure?") skip the entire simulation
#   pipeline. Simulation queries save time via parallel KB + API execution.
#
#   Streaming node events (node_started/node_finished) emit descriptive
#   titles for real-time "thinking" visibility in the frontend.
#
# Import this file into Dify:
#   Dify Dashboard → Create App → Import DSL → Upload this .yml
#
# Before importing:
#   1. Create a Knowledge Base in Dify named "knowledge-base" and upload
#      the file: src/data/knowledge-base.md
#   2. After import, open each Knowledge Retrieval node and select the
#      "knowledge-base" dataset (there are 2 KB nodes — one per path)
#   3. Set environment variables (USDA_API_KEY) in the workflow settings
#
# AGENT MODE ALTERNATIVE:
#   To convert the simulation path into a Dify Agent node:
#   1. Switch app mode to "advanced-chat" (chatflow)
#   2. Replace nodes B1–B6 with a single Agent node
#   3. Add KB Retrieval, USDA, OpenFDA as Agent tools
#   4. The Agent LLM autonomously decides which tools to call
#   Note: Agent mode makes tool calls sequential (1 LLM round per tool).
#   The current parallel HTTP calls (USDA + OFF) in workflow mode are faster
#   for food queries. Use Agent mode only if flexibility > raw speed.
#
# Architecture Flow:
#
#   ┌─────────┐    ┌───────────────────────┐    ┌──────────────┐    ┌────────────────┐
#   │  START  │───▶│ LLM Classify + Route  │───▶│ Code Extract │───▶│ IF/ELSE Intent │
#   │         │    │    (gpt-4o-mini)       │    │ Intent & Item│    │                │
#   └─────────┘    └───────────────────────┘    └──────────────┘    └───────┬────────┘
#                                                                     ┌─────┴──────┐
#                                                                     │            │
#                                                               [general]    [simulation]
#                                                                     │            │
#                  ╔══════════════════════════╗         ╔══════════════╧════════════════════════════╗
#                  ║    PATH A: General Chat  ║         ║       PATH B: Simulation (parallel)      ║
#                  ╠══════════════════════════╣         ╠═══════════════════════════════════════════╣
#                  ║                          ║         ║                                           ║
#                  ║  ┌────────────────────┐  ║         ║  ┌──────────────────┐                     ║
#                  ║  │ KB: Patient Profile│  ║         ║  │ KB: Patient      │──────────────┐      ║
#                  ║  └────────┬───────────┘  ║         ║  │ Clinical Profile │ (parallel)   │      ║
#                  ║           │              ║         ║  └──────────────────┘              │      ║
#                  ║           ▼              ║         ║                                    │      ║
#                  ║  ┌────────────────────┐  ║         ║  ┌──────────────────┐              │      ║
#                  ║  │ LLM Direct Answer  │  ║         ║  │ IF Food or Med?  │              │      ║
#                  ║  │     (gpt-4o)       │  ║         ║  └───────┬──────────┘              │      ║
#                  ║  └────────┬───────────┘  ║         ║    ┌────┴─────┐                    │      ║
#                  ║           │              ║         ║    │          │                     │      ║
#                  ║           ▼              ║         ║ [food]    [med]                    │      ║
#                  ║  ┌────────────────────┐  ║         ║    │          │                     │      ║
#                  ║  │     ANSWER         │  ║         ║    ▼          ▼                     │      ║
#                  ║  └────────────────────┘  ║         ║ ┌──────┐  ┌─────────┐              │      ║
#                  ║                          ║         ║ │ USDA │  │ OpenFDA │              │      ║
#                  ╚══════════════════════════╝         ║ └──┬───┘  └───┬─────┘              │      ║
#                                                       ║    │          │                     │      ║
#                                                       ║    ▼          ▼                     │      ║
#                                                       ║ ┌──────┐  ┌─────────┐              │      ║
#                                                       ║ │Check │  │ Check   │              │      ║
#                                                       ║ │USDA  │  │ OpenFDA │              │      ║
#                                                       ║ └──┬───┘  └───┬─────┘              │      ║
#                                                       ║  ┌─┴──┐    ┌──┴──┐                 │      ║
#                                                       ║  │OK? │    │OK?  │                 │      ║
#                                                       ║  ├─Y──┤    ├──Y──┤                 │      ║
#                                                       ║  │ N  │    │  N  │                 │      ║
#                                                       ║  ▼    │    ▼     │                 │      ║
#                                                       ║ Web   │   Web    │                 │      ║
#                                                       ║ Search│   Search │                 │      ║
#                                                       ║  │    │    │     │                 │      ║
#                                                       ║  └─┬──┘    └──┬──┘                 │      ║
#                                                       ║    └────┬─────┘                    │      ║
#                                                       ║         ▼                          │      ║
#                                                       ║  ┌──────────────┐                  │      ║
#                                                       ║  │  Merge API   │                  │      ║
#                                                       ║  │   Results    │                  │      ║
#                                                       ║  └──────┬───────┘                  │      ║
#                                                       ║         └──────────┬───────────────┘      ║
#                                                       ║                    ▼                       ║
#                                                       ║  ┌─────────────────────────────────────┐  ║
#                                                       ║  │ LLM Analysis + Simulation (gpt-4o)  │  ║
#                                                       ║  │ • Cross-reference safety checks     │  ║
#                                                       ║  │ • Biomarker projections             │  ║
#                                                       ║  │ • Activity suggestions by calories  │  ║
#                                                       ║  └──────────────────┬──────────────────┘  ║
#                                                       ║                     ▼                      ║
#                                                       ║           ┌──────────────────┐             ║
#                                                       ║           │  Code Validate   │             ║
#                                                       ║           └────────┬─────────┘             ║
#                                                       ║                    ▼                       ║
#                                                       ║             ┌────────────┐                 ║
#                                                       ║             │   ANSWER   │                 ║
#                                                       ║             └────────────┘                 ║
#                                                       ╚═══════════════════════════════════════════╝
##############################################################################
app:
  description: >-
    DigiTwin Patient Health Companion v2 — Intent-routed workflow that handles
    general health queries instantly and only runs the full simulation pipeline
    (USDA, OpenFDA, biomarker projections) when the user asks about a specific
    food, snack, supplement, or medication. API failures fall back to web search.
  icon: "\U0001F9EC"
  icon_background: "#E4FBCC"
  mode: workflow
  name: DigiTwin Patient Intake Analyzer v2
  use_icon_as_answer_icon: false

kind: app
version: 0.1.5

workflow:
  conversation_variables: []

  environment_variables:
    - id: env_usda_key
      name: USDA_API_KEY
      value_type: secret
      value: "al8CU1Io2OPnc53rdbejlecexiOb0MHmi8lhMlSM"
      description: "Free key from https://fdc.nal.usda.gov/api-key-signup"

  features:
    file_upload:
      image:
        enabled: true
        number_limits: 1
        transfer_methods:
          - local_file
          - remote_url
    retriever_resource:
      enabled: true
    text_to_speech:
      enabled: false

  graph:
    # ── NODES ──────────────────────────────────────────────────────────────
    nodes:

      # ══════════════════════════════════════════════════════════════════════
      # 1. START
      # ══════════════════════════════════════════════════════════════════════
      - data:
          title: Start
          type: start
          variables:
            - label: Patient ID
              max_length: 10
              options: []
              required: true
              type: text-input
              variable: patient_id
            - label: User Query
              max_length: 1024
              options: []
              required: true
              type: paragraph
              variable: item_text
            - label: Item Image URL
              max_length: 2048
              options: []
              required: false
              type: text-input
              variable: item_image_url
            - label: Simulation Window
              max_length: 10
              options:
                - acute
                - extended
                - both
              required: false
              type: select
              variable: simulation_window
              default: both
        height: 118
        id: node_start
        position:
          x: 80
          y: 282
        type: custom
        width: 244

      # ══════════════════════════════════════════════════════════════════════
      # 2. LLM — Classify & Route (merged intent + item identification)
      # ══════════════════════════════════════════════════════════════════════
      - data:
          title: Classify Query & Identify Item
          desc: >-
            Single fast LLM call that classifies intent AND identifies the
            food/medication item (if any). Replaces the old separate Router +
            Classify nodes, saving one full LLM round-trip.
          type: llm
          model:
            provider: openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.0
              max_tokens: 400
          context:
            enabled: false
          vision:
            enabled: true
            configs:
              detail: high
              variable_selector:
                - sys
                - files
          prompt_template:
            - id: sys_router
              role: system
              text: >-
                You are an intent classifier AND item identifier for a
                patient health companion. Do both steps in one pass.


                ── STEP 1: CLASSIFY INTENT ──

                "simulation" — The user mentions a SPECIFIC food, drink,
                snack, supplement, or medication they consumed or plan to
                consume. They want to simulate the health impact.

                "general_chat" — The user asks a general health question,
                wants biomarkers, trends, medication list, health advice, or
                any conversational query that does NOT involve simulating a
                specific intake item.

                Examples of general_chat:
                - "What's my blood pressure?" / "Show my health trends"
                - "What medications am I on?" / "How's my glucose?"
                - "What should I eat for dinner?" / "How can I sleep better?"
                - "Tell me about my allergies" / "My health status"

                Examples of simulation:
                - "I just ate a pepperoni pizza"
                - "What happens if I take ibuprofen 400mg?"
                - "I had 2 cups of coffee" / "Analyze this food"
                - "Check interaction for metformin"


                ── STEP 2: IF SIMULATION → IDENTIFY THE ITEM ──

                If intent is "simulation", also identify:
                - item_name: What was consumed
                - category: food | snack | beverage | supplement | medication
                - search_term: Best API search query (plain name, no brand)
                - quantity: Amount if mentioned, else null
                - dosage: Dose if medication, else null


                ── IMAGE HANDLING ──

                If an image URL is provided, ANALYZE its visual content:
                - Photo of food/drink → "simulation" + identify the food
                - Photo of pill/medication bottle → "simulation" + identify
                - Screenshot of chart/dashboard/text → "general_chat"
                - No image or empty URL → decide based on text only

                Do NOT blindly assume image = simulation. Look at what it shows.


                ── OUTPUT (JSON only) ──

                {
                  "intent": "simulation" | "general_chat",
                  "confidence": 0.0-1.0,
                  "reason": "brief explanation",
                  "item_name": "string or null",
                  "category": "food|snack|beverage|supplement|medication|null",
                  "search_term": "string or null",
                  "quantity": "string or null",
                  "dosage": "string or null"
                }

                For general_chat, set item fields to null.
            - id: usr_router
              role: user
              text: >-
                Query: {{#node_start.item_text#}}
                Image: {{#node_start.item_image_url#}}
          variables: []
          memory:
            enabled: false
            window:
              enabled: false
              size: 10
        height: 160
        id: node_llm_router
        position:
          x: 380
          y: 282
        type: custom
        width: 244

      # ══════════════════════════════════════════════════════════════════════
      # 3. CODE — Extract Intent + Classification
      # ══════════════════════════════════════════════════════════════════════
      - data:
          title: Extract Intent & Item
          desc: >-
            Parse the merged router+classify LLM output. Extracts intent
            routing AND item classification in one pass.
          type: code
          code_language: python3
          code: |
            import json
            import re

            def main(llm_output: str) -> dict:
                try:
                    parsed = json.loads(llm_output)
                except Exception:
                    match = re.search(r'\{[\s\S]*\}', llm_output)
                    if match:
                        try:
                            parsed = json.loads(match.group())
                        except Exception:
                            parsed = {}
                    else:
                        parsed = {}

                intent = parsed.get("intent", "general_chat").lower().strip()
                if intent not in ("simulation", "general_chat"):
                    intent = "general_chat"

                return {
                    "intent": intent,
                    "confidence": float(parsed.get("confidence", 0.5)),
                    "reason": parsed.get("reason", ""),
                    "item_name": parsed.get("item_name") or "unknown",
                    "category": parsed.get("category") or "food",
                    "search_term": parsed.get("search_term") or parsed.get("item_name") or "",
                    "quantity": parsed.get("quantity") or "",
                    "dosage": parsed.get("dosage") or "",
                }
          variables:
            - value_selector:
                - node_llm_router
                - text
              variable: llm_output
          outputs:
            intent:
              type: string
              children: null
            confidence:
              type: number
              children: null
            reason:
              type: string
              children: null
            item_name:
              type: string
              children: null
            category:
              type: string
              children: null
            search_term:
              type: string
              children: null
            quantity:
              type: string
              children: null
            dosage:
              type: string
              children: null
        height: 160
        id: node_code_router
        position:
          x: 680
          y: 282
        type: custom
        width: 244

      # ══════════════════════════════════════════════════════════════════════
      # 4. IF/ELSE — Route by Intent (NEW)
      # ══════════════════════════════════════════════════════════════════════
      - data:
          title: Needs Simulation?
          desc: >-
            Routes to the fast general-chat path or the full simulation
            pipeline based on the intent classifier output.
          type: if-else
          cases:
            - case_id: "true"
              conditions:
                - comparison_operator: contains
                  id: cond_sim
                  value: "simulation"
                  variable_selector:
                    - node_code_router
                    - intent
              logical_operator: and
        height: 130
        id: node_ifelse_intent
        position:
          x: 980
          y: 282
        type: custom
        width: 244

      # ════════════════════════════════════════════════════════════════════════
      #  PATH A — GENERAL CHAT (fast: 2 LLM calls, 0 API calls)
      # ════════════════════════════════════════════════════════════════════════

      # ── A1. KNOWLEDGE RETRIEVAL — Patient Profile (General Path) ────────
      # Source: knowledge-base.md (uploaded to Dify KB named "knowledge-base")
      - data:
          title: Retrieving your health profile...
          desc: >-
            Queries the "knowledge-base" Knowledge Base by patient_id to pull
            demographics, biomarkers, conditions, allergies, medications.
            Source file: src/data/knowledge-base.md
          type: knowledge-retrieval
          query_variable_selector:
            - node_start
            - patient_id
          dataset_ids:
            - "knowledge-base"
          retrieval_mode: multiple
          multiple_retrieval_config:
            top_k: 5
            score_threshold: 0.3
            reranking_enable: true
            reranking_model:
              provider: ""
              model: ""
          single_retrieval_config:
            model:
              provider: openai
              name: gpt-4o
              mode: chat
              completion_params:
                temperature: 0.2
        height: 120
        id: node_kb_general
        position:
          x: 1280
          y: 80
        type: custom
        width: 244

      # ── A2. LLM — Direct Answer (General Path) ─────────────────────────
      - data:
          title: Answering your health question...
          desc: >-
            Answers general health questions using the patient's clinical
            profile. Provides personalized, conversational responses without
            running the simulation pipeline.
          type: llm
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.4
              max_tokens: 1500
          context:
            enabled: true
            variable_selector:
              - node_kb_general
              - result
          vision:
            enabled: false
          prompt_template:
            - id: sys_direct
              role: system
              text: >-
                You are the Health Companion for DigiTwin, an AI-powered
                biological digital twin platform. You have access to the
                patient's full clinical profile.


                PATIENT PROFILE (from Knowledge Base):

                {{#context#}}


                INSTRUCTIONS:

                - Answer the patient's question using their actual data

                - Be conversational, empathetic, and educational

                - Reference specific biomarker values, trends, and conditions

                - Provide actionable health insights when relevant

                - If they ask about medications, list their current meds with
                  purposes

                - If they ask about trends, reference their longitudinal data

                - If they ask what to eat/avoid, use their conditions, allergies,
                  and dietary restrictions to personalize advice

                - Do NOT run simulations — just provide informative answers

                - If the question would benefit from a food/medication
                  simulation, suggest they try: "Analyze [food/med name]"


                Return a JSON response:

                {
                  "reply": "Your conversational response (use markdown for formatting)",
                  "suggestions": ["2-4 follow-up questions or actions the user might want"],
                  "data_referenced": ["list of data points from their profile you used"]
                }
            - id: usr_direct
              role: user
              text: >-
                Patient {{#node_start.patient_id#}} asks:
                {{#node_start.item_text#}}
          variables: []
          memory:
            enabled: false
            window:
              enabled: false
              size: 10
        height: 240
        id: node_llm_direct
        position:
          x: 1580
          y: 30
        type: custom
        width: 244

      # ── A3. ANSWER — General Chat Response ──────────────────────────────
      - data:
          title: Return Chat Response
          type: answer
          answer: "{{#node_llm_direct.text#}}"
        height: 80
        id: node_answer_general
        position:
          x: 1880
          y: 80
        type: custom
        width: 244

      # ════════════════════════════════════════════════════════════════════════
      #  PATH B — SIMULATION (full: 3 LLM calls + API lookups)
      # ════════════════════════════════════════════════════════════════════════

      # ── B1. KNOWLEDGE RETRIEVAL — Patient Profile (Simulation Path) ─────
      # Source: knowledge-base.md (uploaded to Dify KB named "knowledge-base")
      - data:
          title: Loading patient clinical profile...
          desc: >-
            Queries the "knowledge-base" Knowledge Base by patient_id to pull
            full clinical profile: biomarkers, pharmacogenomics, conditions,
            allergies, medications, lifestyle, and longitudinal data.
            Source file: src/data/knowledge-base.md
          type: knowledge-retrieval
          query_variable_selector:
            - node_start
            - patient_id
          dataset_ids:
            - "knowledge-base"
          retrieval_mode: multiple
          multiple_retrieval_config:
            top_k: 5
            score_threshold: 0.3
            reranking_enable: true
            reranking_model:
              provider: ""
              model: ""
          single_retrieval_config:
            model:
              provider: openai
              name: gpt-4o
              mode: chat
              completion_params:
                temperature: 0.2
        height: 120
        id: node_kb_sim
        position:
          x: 1280
          y: 480
        type: custom
        width: 244

      # ── B2. IF/ELSE — Route by Category ────────────────────────────────
      - data:
          title: Food or Medication?
          desc: Routes to USDA for food items or OpenFDA for medications.
          type: if-else
          cases:
            - case_id: "true"
              conditions:
                - comparison_operator: contains
                  id: cond_food
                  value: "food"
                  variable_selector:
                    - node_code_router
                    - category
                - comparison_operator: contains
                  id: cond_snack
                  value: "snack"
                  variable_selector:
                    - node_code_router
                    - category
                - comparison_operator: contains
                  id: cond_beverage
                  value: "beverage"
                  variable_selector:
                    - node_code_router
                    - category
              logical_operator: or
        height: 130
        id: node_ifelse_category
        position:
          x: 2180
          y: 480
        type: custom
        width: 244

      # ── B5a. HTTP — USDA FoodData Central (food branch) ────────────────
      - data:
          title: Looking up nutrition data...
          desc: >-
            Fetches nutritional data from USDA FoodData Central for the
            identified food item.
          type: http-request
          method: get
          url: "https://api.nal.usda.gov/fdc/v1/foods/search?query={{#node_code_router.search_term#}}&pageSize=3&api_key={{#env.USDA_API_KEY#}}"
          authorization:
            type: no-auth
            config: null
          headers: ""
          params: ""
          body:
            type: none
            data: ""
          timeout:
            connect: 10
            read: 30
            write: 10
          retry:
            max_retries: 3
            retry_interval: 1000
          error_strategy: default-value
          default_value:
            - id: body
              key: body
              name: body
              type: string
              value: '{"foods": []}'
            - id: status_code
              key: status_code
              name: status_code
              type: number
              value: 0
          variables: []
        height: 140
        id: node_http_usda
        position:
          x: 2480
          y: 360
        type: custom
        width: 244

      # ── B5b-pre. CODE — Map non-US brand names to generic names ───────
      # "Doliprane" → "acetaminophen", "Efferalgan" → "acetaminophen", etc.
      # This ensures OpenFDA (US-only database) can find the drug.
      - data:
          title: Mapping drug brand to generic name...
          desc: >-
            Maps common non-US (especially French/European) brand names to
            their FDA-registered generic equivalents. OpenFDA only contains
            US-registered drugs, so non-US brands like Doliprane, Efferalgan,
            Spasfon etc. will 404 without this mapping.
          type: code
          code_language: python3
          code: |
            def main(search_term: str, item_name: str) -> dict:
                # Map of non-US brand names → FDA generic names
                brand_to_generic = {
                    # Paracetamol / Acetaminophen brands
                    "doliprane": "acetaminophen",
                    "efferalgan": "acetaminophen",
                    "dafalgan": "acetaminophen",
                    "panadol": "acetaminophen",
                    "tylenol": "acetaminophen",
                    "paracetamol": "acetaminophen",
                    "paracetamole": "acetaminophen",
                    # NSAIDs
                    "nurofen": "ibuprofen",
                    "advil": "ibuprofen",
                    "brufen": "ibuprofen",
                    "voltaren": "diclofenac",
                    "voltarene": "diclofenac",
                    # GI
                    "spasfon": "phloroglucinol",
                    "smecta": "diosmectite",
                    "imodium": "loperamide",
                    "gaviscon": "alginate",
                    "maalox": "aluminum hydroxide",
                    # Allergy
                    "zyrtec": "cetirizine",
                    "aerius": "desloratadine",
                    "clarityne": "loratadine",
                    "claritin": "loratadine",
                    "xyzall": "levocetirizine",
                    # Antibiotics
                    "augmentin": "amoxicillin clavulanate",
                    "clamoxyl": "amoxicillin",
                    "amoxil": "amoxicillin",
                    "zithromax": "azithromycin",
                    # Cardiovascular
                    "tahor": "atorvastatin",
                    "lipitor": "atorvastatin",
                    "crestor": "rosuvastatin",
                    # Diabetes
                    "glucophage": "metformin",
                    "stagid": "metformin",
                    "januvia": "sitagliptin",
                    # Other common
                    "lexomil": "bromazepam",
                    "xanax": "alprazolam",
                    "stilnox": "zolpidem",
                    "ambien": "zolpidem",
                    "prozac": "fluoxetine",
                    "deroxat": "paroxetine",
                }

                # Normalize: lowercase, strip dosage numbers
                key = search_term.lower().strip()
                # Remove trailing dosage like "1000mg", "500 mg", etc.
                import re
                key = re.sub(r'\s*\d+\s*(mg|g|ml|mcg|iu)\b.*', '', key).strip()

                generic = brand_to_generic.get(key, search_term)
                mapped = key != generic.lower()

                return {
                    "fda_search_term": generic,
                    "original_term": search_term,
                    "was_mapped": "yes" if mapped else "no",
                }
          variables:
            - value_selector:
                - node_code_router
                - search_term
              variable: search_term
            - value_selector:
                - node_code_router
                - item_name
              variable: item_name
